<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28664e">
  <meta name="description" content="節約、長期投資、人生とお金。毎日ひとつ、未来の自分に届けたい言葉。">
  <title>資産形成おじさんの一言</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2750%27 font-size=%2750%27%3E🌱%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./quotes.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand-mark" aria-hidden="true">🌱</div>
      <p class="eyebrow">小さな習慣、大きな未来。</p>
      <h1>資産形成おじさんの一言</h1>
      <p class="subtitle">未来のお金と、今日の自分のために。</p>
    </header>
    <section aria-label="言葉を選ぶ">
      <label for="category">今日は、どんな言葉に出会う？</label>
      <select id="category"><option value="すべて">すべて</option></select>
      <article class="quote-card" aria-labelledby="quote-text">
        <div class="card-top"><span id="quote-mode">今日の一言</span><span id="quote-category" class="badge"></span></div>
        <div class="quote-mark" aria-hidden="true">“</div>
        <p id="quote-text" aria-live="polite"></p>
        <p class="card-note">未来の自分へ、ひとこと。</p>
      </article>
      <button id="next" class="primary" type="button">🎲 次の言葉</button>
      <div class="actions">
        <button id="favorite" type="button" aria-pressed="false">♡ お気に入り</button>
        <button id="share" type="button">↗ シェア</button>
      </div>
      <p id="status" role="status" class="status"></p>
      <button id="show-favorites" class="text-button" type="button" aria-expanded="false" aria-controls="favorites">お気に入りを見る <span id="favorite-count">0</span></button>
    </section>
    <section id="favorites" class="favorites" hidden aria-labelledby="favorites-heading">
      <h2 id="favorites-heading">あとで読みたい一言</h2>
      <p class="small">お気に入りは、このブラウザに保存されます。</p>
      <ul id="favorite-list"></ul>
      <p id="empty-favorites">心に残った言葉を、♡で集めてみましょう。</p>
    </section>
    <footer>
      <p class="closing">今日も一歩ずつ。資産形成は長期戦。</p>
      <p>本アプリは資産形成を考えるための情報・モチベーション提供を目的としたものであり、特定の金融商品や投資成果を保証するものではありません。</p>
    </footer>
    <noscript>言葉の表示にはJavaScriptを有効にしてください。</noscript>
  </main>
</body>
</html>
